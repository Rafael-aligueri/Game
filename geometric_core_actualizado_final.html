<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d2b29">
<title>GEOMETRIC CORE · Edición Atompunk · V8 VISUAL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/limelight@5/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@5/400.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@5/600.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@5/700.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2@5/800.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/special-elite@5/index.min.css">
<style>
:root{
  --paper:#eee0bd; --paper2:#e0cca0; --cream:#f8eed6; --ink:#241d15; --ink2:#57493c;
  --sage:#9aa06e; --sage-d:#6a7048; --teal:#3f8f85; --teal-d:#1f5650; --night:#1d2b29; --night2:#131f1e;
  --coral:#d84f2b; --red:#b53526; --mustard:#dcae47; --amber:#e0a239; --magenta:#b44c8c; --pink:#d673a6;
  --chrome:#d8d1c1; --sky:#d6cda2; --ok:#6b9a70; --warn:#dcae47; --danger:#b53526; --info:#3f8f85;
  --slab:'Limelight','Georgia',serif; --ui:'Baloo 2','Trebuchet MS',sans-serif; --mono:'Special Elite','Courier New',monospace;
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --hard:5px 6px 0 rgba(36,29,21,.32); --hard-sm:3px 4px 0 rgba(36,29,21,.32);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ui);background:var(--paper);color:var(--ink);letter-spacing:.02em;user-select:none;-webkit-user-select:none}
button{font-family:var(--ui);cursor:pointer;border:none;background:none;color:inherit}
*{scrollbar-width:thin;scrollbar-color:var(--coral) var(--paper2)}
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:var(--paper2);border-left:2px solid var(--ink)}
*::-webkit-scrollbar-thumb{background:var(--coral);border:2px solid var(--ink);border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:var(--red)}
.hidden{display:none!important}
#app{position:fixed;inset:0;height:100dvh;background:var(--paper)}
#grain{position:fixed;inset:-40px;z-index:90;pointer-events:none;opacity:.18;mix-blend-mode:multiply;
  background-image:radial-gradient(ellipse at 50% 44%,rgba(0,0,0,0) 48%,rgba(30,23,14,.32) 100%),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="180" height="180" filter="url(%23n)"/></svg>');
  animation:filmFlick .44s steps(2,end) infinite}
@keyframes filmFlick{0%{transform:translate(0,0);opacity:.18}50%{transform:translate(4px,-3px);opacity:.215}100%{transform:translate(0,0);opacity:.18}}
/* rubber-hose line boil: jitter de dibujo a mano en 2-3 poses */
@keyframes rhJit{0%{rotate:-.55deg}50%{rotate:.65deg}100%{rotate:-.55deg}}
.halftone{background-image:radial-gradient(rgba(36,29,21,.16) 1px,transparent 1.4px);background-size:7px 7px}
.screen{position:absolute;inset:0}
/* ============ MENU ============ */
#menuScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(180deg,#c2ad7e 0%,var(--sky) 32%,var(--paper) 70%,var(--paper2) 100%)}
/* ---- Fondo del menú: ilustración atompunk integrada (imagen del jugador) ---- */
#menuBG{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;z-index:1;pointer-events:none;user-select:none;-webkit-user-drag:none}
#menuAnim{position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block;pointer-events:none}
#menuHalft{z-index:3}
/* Pantallas apaisadas (escritorio): desenfoque suave para separar la interfaz del fondo */
@media (min-aspect-ratio:1/1){#menuBG{filter:blur(2px) saturate(.96) brightness(.95);transform:scale(1.03)}}
#menuRays{position:absolute;left:50%;top:-42vmin;width:120vmin;height:120vmin;transform:translateX(-50%);border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(220,174,71,.26) 0deg 7deg,rgba(220,174,71,0) 7deg 16deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,transparent 62%);mask-image:radial-gradient(circle,#000 0%,transparent 62%);
  animation:raysSpin 90s linear infinite}
@keyframes raysSpin{to{transform:translateX(-50%) rotate(360deg)}}
#menuHalft{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(84,72,40,.13) 1.2px,transparent 1.6px);background-size:9px 9px}
.cloud{position:absolute;background:var(--cream);border:3px solid rgba(36,29,21,.6);border-radius:60px;opacity:.85;box-shadow:var(--hard-sm)}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--cream);border:3px solid rgba(36,29,21,.6);border-radius:50%;border-bottom-color:transparent}
.c1{width:150px;height:38px;left:8%;top:16%;animation:drift 46s linear infinite,rhJit .34s steps(2,end) infinite}
.c1::before{width:52px;height:52px;left:22px;top:-26px}.c1::after{width:36px;height:36px;left:74px;top:-16px}
.c2{width:110px;height:30px;right:10%;top:26%;animation:drift 60s linear infinite reverse,rhJit .31s steps(2,end) infinite}
.c2::before{width:40px;height:40px;left:16px;top:-20px}.c2::after{width:28px;height:28px;left:58px;top:-12px}
@keyframes drift{0%{transform:translateX(-30px)}50%{transform:translateX(30px)}100%{transform:translateX(-30px)}}
#menuRocket{position:absolute;top:12%;left:-140px;width:150px;animation:rocketFly 17s linear infinite,rhJit .3s steps(2,end) infinite;filter:drop-shadow(3px 4px 0 rgba(36,29,21,.3))}
@keyframes rocketFly{0%{transform:translate(-12vw,30px) rotate(8deg)}28%{transform:translate(22vw,-16px) rotate(-7deg)}55%{transform:translate(55vw,8px) rotate(6deg)}80%{transform:translate(85vw,-10px) rotate(-6deg)}100%{transform:translate(114vw,16px) rotate(7deg)}}
#menuRocket .flame{animation:flick .18s steps(2) infinite}
@keyframes flick{50%{opacity:.35}}
#menuRocket .rarm{transform-box:fill-box;transform-origin:2% 96%;animation:armWave .5s steps(2,end) infinite}
@keyframes armWave{0%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}100%{transform:rotate(-7deg)}}
#skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:min(30vh,260px);pointer-events:none;transform-origin:50% 100%;animation:rhJit .46s steps(2,end) infinite}
#menuTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;align-items:center;padding:14px 16px;z-index:5}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:var(--hard-sm);font-size:19px;font-weight:700;color:var(--teal-d);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .18s var(--bounce)}
.iconbtn:hover{transform:translate(-1px,-3px) rotate(-5deg)}
.iconbtn:active{transform:translate(2px,2px) scale(1.1,.88);box-shadow:1px 1px 0 rgba(36,29,21,.32)}
.iconbtn.muted{color:var(--ink2);opacity:.75}
.iconbtn.muted::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:3px;background:var(--red);transform:rotate(-38deg);border-radius:2px}
#menuInner{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px 16px;max-height:100dvh;overflow-y:auto;width:100%}
#logo{text-align:center;line-height:.92;margin-top:0;animation:riseIn .75s .15s var(--bounce) both,rhJit .38s steps(2,end) infinite}
#logo .l1{display:block;font-family:var(--slab);font-size:clamp(26px,5.4vmin,44px);letter-spacing:.14em;color:var(--cream);-webkit-text-stroke:2.5px var(--ink);text-shadow:2.5px 2.5px 0 rgba(36,29,21,.35),5px 5px 0 var(--teal-d)}
#logo .l2{display:block;font-family:var(--slab);font-size:clamp(58px,12vmin,96px);letter-spacing:.04em;color:var(--coral);-webkit-text-stroke:2.5px var(--ink);text-shadow:5px 6px 0 var(--mustard),8px 10px 0 rgba(36,29,21,.28)}
#tagline{font-family:var(--mono);font-weight:600;font-size:clamp(10px,1.8vmin,13px);letter-spacing:.32em;color:var(--teal-d);background:var(--cream);border:2px solid var(--ink);padding:4px 14px 4px 18px;border-radius:999px;box-shadow:var(--hard-sm);animation:riseIn .7s .28s var(--bounce) both}
#menuMascot{position:absolute;top:clamp(38px,6.2vh,62px);right:4.5%;width:clamp(86px,22vw,128px);height:auto;display:block;border:0;border-radius:0;background:transparent;box-shadow:none;filter:drop-shadow(3px 5px 0 rgba(36,29,21,.28));transform:rotate(7deg);animation:mascotFloat 3.2s ease-in-out infinite;pointer-events:none;z-index:6}
@keyframes mascotFloat{0%,100%{transform:translateY(2px) rotate(7deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@media(max-width:520px){#menuMascot{top:clamp(34px,5.8vh,54px);right:3.5%;width:clamp(82px,22vw,108px)}}
@media(min-width:900px){#menuMascot{top:50px;right:calc(50% - 270px);width:148px}}
@keyframes mascotIn{from{transform:translateY(38px) rotate(5deg) scale(.8);opacity:0}70%{transform:translateY(-6px) rotate(-4deg) scale(1.04);opacity:1}to{transform:rotate(-2.5deg) scale(1);opacity:1}}
@keyframes riseIn{from{transform:translateY(30px) rotate(-2deg);opacity:0}70%{transform:translateY(-4px) rotate(.6deg);opacity:1}}
#menuBtns{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);margin-top:8px}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;letter-spacing:.12em;font-size:15px;padding:13px 18px;border:3px solid var(--ink);border-radius:999px;box-shadow:var(--hard);transition:transform .2s var(--bounce),box-shadow .2s var(--bounce);text-transform:uppercase;color:var(--cream)}
.btn:hover{transform:translate(-1px,-3px) rotate(-1.2deg) scale(1.02);box-shadow:7px 8px 0 rgba(36,29,21,.32)}
.btn:active{transform:translate(2px,3px) scale(1.06,.9);box-shadow:1px 1px 0 rgba(36,29,21,.32)}
.btn-coral{background:linear-gradient(160deg,var(--coral),var(--red))}
.btn-teal{background:linear-gradient(160deg,var(--teal),var(--teal-d))}
.btn-mustard{background:linear-gradient(160deg,var(--mustard),var(--amber));color:var(--ink)}
.btn-sage{background:linear-gradient(160deg,var(--sage),var(--sage-d))}
.btn-ghost{background:var(--cream);color:var(--ink)}
.btn-big{font-size:19px;padding:16px}
.btn .pebadge{position:absolute;right:-10px;top:-12px;background:var(--mustard);color:var(--ink);border:2.5px solid var(--ink);font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;transform:rotate(6deg);box-shadow:2px 2px 0 rgba(36,29,21,.3)}
#menuBtns .btn:nth-child(1){animation:riseIn .6s .46s both}#menuBtns .btn:nth-child(2){animation:riseIn .6s .56s both}
#menuBtns .btn:nth-child(3){animation:riseIn .6s .66s both}#menuBtns .btn:nth-child(4){animation:riseIn .6s .76s both}
#menuHint{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--ink);text-align:center;padding:5px 15px;animation:riseIn .6s .88s both;background:rgba(238,224,189,.85);border-radius:999px;text-shadow:0 1px 0 rgba(248,238,214,.55)}
/* ============ GAME / HUD ============ */
#gameScreen{background:repeating-linear-gradient(45deg,var(--paper2) 0 14px,var(--paper) 14px 28px);display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;height:100%;background:var(--night);overflow:hidden;border:0 solid var(--ink)}
#stage.letter{border-width:4px;box-shadow:0 0 0 6px var(--paper2),0 0 0 8px var(--ink)}
#cvs{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;-webkit-touch-callout:none}
#dangerVeil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 120px 30px rgba(181,53,38,.55)}
#dangerVeil.on{opacity:1;animation:dangerPulse 1s ease-in-out infinite}
@keyframes dangerPulse{50%{opacity:.45}}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:10px 10px;z-index:10;pointer-events:none}
#hudLeft{display:inline-flex;flex-direction:column;align-items:stretch;gap:7px;max-width:calc(100% - 92px)}
#hudChips{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.chip{pointer-events:auto;display:flex;align-items:center;gap:5px;background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;padding:4px 11px;box-shadow:2px 4px 0 var(--ink);font-family:var(--ui);font-weight:800;font-size:11.5px;color:var(--ink);white-space:nowrap}
.chip .lab{font-family:var(--ui);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.chip.wave{background:var(--coral);color:var(--cream);border-color:var(--ink)}
.chip.wave .lab{color:var(--cream)}
.chip.kills{background:var(--cream);color:var(--ink)}
.chip.kills .lab{color:var(--ink)}
.chip.pe{background:var(--mustard);color:var(--ink);border-color:var(--ink)}
.chip.pe .lab{color:var(--ink)}
#hpChip{position:relative;width:100%;min-width:215px;max-width:265px;flex-direction:column;align-items:stretch;gap:6px;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none}
#hpChip .row{display:flex;justify-content:space-between;align-items:center;gap:7px}
#hpChip .lab{color:var(--cream);font-size:10.5px;font-weight:800;letter-spacing:.06em;flex:none;text-shadow:1px 2px 3px rgba(0,0,0,.85)}
#hpText{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--cream);flex:none;text-shadow:1px 2px 3px rgba(0,0,0,.85)}
#hpBar{flex:1;max-width:105px;height:10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper2);overflow:hidden}
#hpFill{height:100%;width:100%;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(36,29,21,.22) 11px 12.5px),linear-gradient(180deg,#4aa596,#357e74);transition:width .25s;border-radius:999px}
#hpFill.low{background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(36,29,21,.22) 11px 12.5px),linear-gradient(180deg,#dd6038,#b23a2a)}
.nvrow{margin-top:0;gap:8px}
.nvbadge{background:#2c6f63;color:var(--cream);font-family:var(--ui);font-weight:800;font-size:10px;padding:2px 9px;border-radius:999px;border:2px solid var(--ink);letter-spacing:.05em;white-space:nowrap;flex:none}
#xpBar{flex:1;min-width:54px;height:9px;border:2px solid var(--ink);border-radius:999px;background:var(--paper2);overflow:hidden}
#xpFill{height:100%;width:0%;background:linear-gradient(90deg,#245a52,#3a8f83,#d9ab3e);transition:width .25s;border-radius:999px}
#xpText{min-width:52px;text-align:right;font-family:var(--mono);font-size:9px;font-weight:800;color:var(--cream);white-space:nowrap;text-shadow:1px 2px 3px rgba(0,0,0,.85)}
#hudRight{display:flex;gap:6px;margin-left:auto;align-items:flex-start;flex:none}
.hudbtn{pointer-events:auto;width:38px;height:38px;border-radius:12px;background:var(--cream);border:2.5px solid var(--ink);box-shadow:2px 4px 0 var(--ink);font-size:16px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s var(--bounce)}
.hudbtn:active{transform:translate(2px,2px) scale(1.08,.88);box-shadow:1px 1px 0 var(--ink)}
.hudbtn.muted{opacity:.7}.hudbtn.muted::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:3px;background:var(--red);transform:rotate(-38deg);border-radius:2px}
#bossBarWrap{position:absolute;top:114px;left:50%;transform:translateX(-50%);width:min(420px,72vw);z-index:9;pointer-events:none}
#bossBarWrap .blab{font-family:var(--slab);font-size:12px;letter-spacing:.2em;color:var(--pink);text-align:center;text-shadow:1px 2px 0 var(--ink);margin-bottom:3px}
#bossBar{height:12px;border:2.5px solid var(--ink);border-radius:999px;background:rgba(19,31,30,.75);overflow:hidden;box-shadow:3px 4px 0 rgba(36,29,21,.25)}
#bossBarFill{height:100%;width:100%;background:linear-gradient(90deg,#b14b89,#d472a4);transition:width .2s;border-radius:999px}
#versionTag{display:none}
#runHint{position:absolute;left:50%;bottom:106px;transform:translateX(-50%);z-index:8;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--cream);background:rgba(19,31,30,.78);border:2px solid rgba(220,174,71,.55);padding:5px 12px;border-radius:999px;pointer-events:none;transition:opacity 1s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#weaponDock{position:absolute;right:10px;bottom:16px;z-index:8;display:grid;grid-template-columns:repeat(3,35px);gap:6px;justify-content:end;pointer-events:none}
.wdock{position:relative;width:35px;height:35px;border-radius:11px;background:var(--cream);border:2.5px solid var(--ink);box-shadow:2px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0;font-size:0;color:var(--ink)}
.wdock span{display:none}
.wdock svg{width:19px;height:19px}
.wdock.synergy::after{content:"✦";position:absolute;right:-5px;top:-6px;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--mustard);border:1.5px solid var(--ink);color:var(--ink);font:700 10px var(--mono);box-shadow:1px 1px 0 rgba(36,29,21,.4)}
#ultBtn{--chg:0%;position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:11;width:76px;height:76px;border-radius:50%;border:3px solid var(--ink);background:conic-gradient(#d84f2b var(--chg),#c26b47 var(--chg));box-shadow:2px 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:transform .15s var(--bounce)}
#ultBtn::before{content:"";position:absolute;inset:7px;border-radius:50%;background:linear-gradient(160deg,#ecc76a,#d9a63c);border:2.5px solid var(--ink)}
#ultBtn.locked::before{background:linear-gradient(160deg,#ecc76a,#d9a63c)}
#ultBtn.ready{animation:ultPulse 1.1s ease-in-out infinite}
#ultBtn.active::before{background:linear-gradient(160deg,#d472a4,#b14b89)}
@keyframes ultPulse{50%{transform:translateX(-50%) scale(1.07,.94);box-shadow:2px 4px 0 var(--ink),0 0 26px rgba(220,174,71,.5)}}
#ultBtn:active{transform:translateX(-50%) scale(.94)}
#ultGlyph{position:relative;font-size:28px;line-height:1;color:var(--ink);filter:drop-shadow(1px 2px 0 rgba(36,29,21,.35))}
#ultSub{display:none}
#toasts{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(360px,90vw)}
.toast{background:var(--cream);border:2.5px solid var(--ink);border-left:8px solid var(--teal);border-radius:16px;box-shadow:var(--hard-sm);padding:8px 14px;font-weight:600;font-size:12.5px;letter-spacing:.06em;animation:toastIn .32s var(--bounce) both;max-width:100%;text-align:center}
.toast.gold{border-left-color:var(--mustard)}.toast.pink{border-left-color:var(--magenta)}.toast.red{border-left-color:var(--red)}
.toast.out{animation:toastOut .3s both}
@keyframes toastIn{from{transform:translateY(-18px) scale(.9) rotate(-1.5deg);opacity:0}}
@keyframes toastOut{to{transform:translateY(-12px);opacity:0}}
.banner{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;text-align:center}
#waveBanner .btext{display:inline-block;font-family:var(--slab);font-size:clamp(22px,5.2vmin,36px);color:var(--cream);letter-spacing:.08em;background:var(--coral);border:3px solid var(--ink);padding:10px 28px;border-radius:999px;box-shadow:4px 5px 0 rgba(36,29,21,.3);text-shadow:2px 2px 0 rgba(36,29,21,.35)}
#bossBanner .btext{display:inline-block;font-family:var(--slab);font-size:clamp(18px,4.2vmin,30px);color:var(--cream);letter-spacing:.08em;background:#b14b89;border:3px solid var(--ink);padding:10px 22px;border-radius:999px;box-shadow:4px 5px 0 rgba(36,29,21,.3);text-shadow:2px 2px 0 rgba(36,29,21,.35)}
.banner.show{animation:bannerIn 1.7s var(--bounce) both}
#bossBanner.show{animation:bannerIn 2.6s var(--bounce) both}
@keyframes bannerIn{0%{transform:translate(-50%,-50%) scale(1.7) rotate(-5deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1) rotate(2deg);opacity:1}26%{transform:translate(-50%,-50%) scale(1) rotate(-1deg)}82%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-1deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.94) rotate(1.5deg)}}
/* ============ OVERLAYS ============ */
.overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(26,21,15,.78);backdrop-filter:blur(2px)}
.overlay::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(248,238,214,.07) 1px,transparent 1.4px);background-size:8px 8px;pointer-events:none}
.panel{position:relative;background:var(--paper);border:3.5px solid var(--ink);border-radius:22px;box-shadow:8px 10px 0 rgba(22,17,11,.55);padding:22px 24px;max-width:min(920px,96vw);max-height:94dvh;overflow-y:auto;width:100%;animation:panelIn .4s var(--bounce) both}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;background-image:radial-gradient(rgba(36,29,21,.09) 1px,transparent 1.3px);background-size:7px 7px;pointer-events:none}
@keyframes panelIn{from{transform:translateY(36px) rotate(-2.2deg) scale(.92);opacity:0}}
.kicker{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.3em;color:var(--teal-d);text-transform:uppercase}
.panel h2{font-family:var(--slab);font-size:clamp(24px,4.6vmin,38px);color:var(--coral);-webkit-text-stroke:1.2px var(--ink);text-shadow:3px 3px 0 var(--mustard);letter-spacing:.03em;margin:4px 0 6px;line-height:1.05}
.panel .sub{font-weight:600;letter-spacing:.16em;font-size:13px;color:var(--ink2);text-transform:uppercase}
.panel .note{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:6px}
.xclose{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:var(--cream);border:2.5px solid var(--ink);box-shadow:var(--hard-sm);font-weight:700;font-size:14px;z-index:3;transition:transform .15s var(--bounce)}
.xclose:active{transform:translate(2px,2px) scale(1.08,.88);box-shadow:none}
.center{text-align:center}
/* cards — mazo de mejoras rubber hose */
#cardsTrack{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:22px 8px 26px;margin-top:8px;scroll-padding-left:8px}
.card{flex:0 0 250px;scroll-snap-align:center;background:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--hard);cursor:pointer;transition:transform .2s var(--bounce),box-shadow .2s var(--bounce);position:relative;text-align:left;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.card:hover{transform:translateY(-7px) rotate(-1.1deg);box-shadow:9px 13px 0 rgba(36,29,21,.32)}
.card:active{transform:translateY(-2px) scale(1.02,.97)}
.card.atompunk-card{min-height:410px;background:var(--cream)}
.card .ap-head{min-height:66px;display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(135deg,var(--night),var(--night2));color:var(--cream);border-bottom:3px solid var(--ink);position:relative}
.card .ap-head:after{content:"";position:absolute;right:8px;top:7px;width:22px;height:22px;border-top:2px solid rgba(220,174,71,.8);border-right:2px solid rgba(220,174,71,.8);transform:skew(-15deg);pointer-events:none}
.card .ap-mark{width:44px;height:44px;flex:none;border:2.5px solid var(--mustard);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--teal-d);overflow:hidden;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.card .ap-mark svg{width:27px;height:27px;stroke:var(--cream);flex:none}
.card .ap-mark img{width:100%;height:100%;object-fit:cover;display:block}

/* Dispersor Iónico · paleta por categoría aprobada */
.card.ion-reb .ap-head{background:linear-gradient(135deg,#1f5a52,#123430)}
.card.ion-reb .ap-mark{background:#3a8f83;border-color:#cde4d6}
.card.ion-reb .pip.on{background:#3a8f83}
.card.ion-mul .ap-head{background:linear-gradient(135deg,#93401d,#572710)}
.card.ion-mul .ap-mark{background:#cd5a2e;border-color:#eec27e}
.card.ion-mul .pip.on{background:#cd5a2e}
.card.ion-esp .ap-head{background:linear-gradient(135deg,#52406e,#2e2140)}
.card.ion-esp .ap-mark{background:#6d5a8c;border-color:#ddc9ea}
.card.ion-esp .pip.on{background:#6d5a8c}
.card.ion-per .ap-head{background:linear-gradient(135deg,#40693f,#223d26)}
.card.ion-per .ap-mark{background:#5d8f5f;border-color:#cfe0c2}
.card.ion-per .pip.on{background:#5d8f5f}
.card.ion-sob .ap-head{background:linear-gradient(135deg,#8a6420,#4d3407)}
.card.ion-sob .ap-mark{background:#b98f2e;border-color:#f0d68a}
.card.ion-sob .pip.on{background:#b98f2e}
.card.ion-weapon .ap-head{background:linear-gradient(135deg,#1f5a52,#121d1c)}
.card.ion-weapon .ap-mark{border-color:#cde4d6}

.card .ap-headcopy{min-width:0;display:flex;flex-direction:column;gap:3px;padding-right:18px}
.card .ap-kicker{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--mustard);line-height:1.15;text-transform:uppercase}
.card .ap-title{font-family:var(--ui);font-weight:800;font-size:14px;line-height:1.12;letter-spacing:.015em;color:var(--cream);text-shadow:1.5px 1.5px 0 rgba(0,0,0,.45);overflow-wrap:anywhere}
.card .ap-art{height:188px;flex:none;position:relative;overflow:hidden;background:var(--teal-d);border-bottom:3px solid var(--ink)}
.card .ap-art>img{width:100%;height:100%;object-fit:cover;display:block}
.card .ap-art-fallback{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,rgba(205,227,214,.32),transparent 45%),repeating-conic-gradient(from 8deg at 50% 50%,rgba(220,174,71,.18) 0deg 5deg,transparent 5deg 15deg),linear-gradient(145deg,#2b6157,var(--night2));}
.card .ap-art-fallback:before{content:"";position:absolute;inset:12px;border:1px dashed rgba(248,238,214,.35);border-radius:50%;}
.card .ap-art-icon{position:relative;z-index:1;width:78px;height:78px;display:flex;align-items:center;justify-content:center;color:var(--mustard);filter:drop-shadow(3px 4px 0 rgba(19,31,30,.45));}
.card .ap-art-icon svg{width:100%;height:100%;stroke:currentColor;stroke-width:1.8}
.card .ap-copy{padding:11px 13px 12px;display:flex;flex-direction:column;gap:9px;flex:1;background:linear-gradient(180deg,#f6ecd0 0%,var(--cream) 100%);}
.card .ap-desc{font-size:12.6px;font-weight:600;line-height:1.38;color:var(--ink);min-height:48px;}
.card .ap-meta{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:auto;min-height:18px}
.card .pips{display:flex;gap:4px;flex:none}
.card .pip{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--paper2)}
.card .pip.on{background:var(--amber)}
.card .ctag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--teal-d);text-align:right}
.card .ap-action{display:flex;justify-content:flex-end;align-items:center;margin-top:1px}
.card .pick{font-weight:800;font-size:10.5px;letter-spacing:.18em;color:var(--cream);background:var(--ink);padding:6px 12px;border:2px solid var(--ink);border-radius:999px;box-shadow:2px 3px 0 rgba(36,29,21,.25)}
.card .newbadge{position:absolute;top:70px;right:7px;width:65px;height:65px;background:var(--mustard);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:8.5px;letter-spacing:.06em;line-height:1.15;color:var(--ink);clip-path:polygon(50% 0%,61% 12%,76% 6%,79% 22%,95% 24%,89% 39%,100% 50%,89% 61%,95% 76%,79% 78%,76% 94%,61% 88%,50% 100%,39% 88%,24% 94%,21% 78%,5% 76%,11% 61%,0% 50%,11% 39%,5% 24%,21% 22%,24% 6%,39% 12%);transform:rotate(12deg);z-index:2;animation:badgeSpin 5s ease-in-out infinite}
@keyframes badgeSpin{0%{transform:rotate(9deg) scale(1)}50%{transform:rotate(16deg) scale(1.07)}100%{transform:rotate(9deg) scale(1)}}
.card.chosen{outline:4px solid var(--mustard);outline-offset:3px}
.card .stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(238,224,189,.55);z-index:3;border-radius:17px}
.card .stamp span{font-family:var(--slab);font-size:22px;color:var(--red);border:4px solid var(--red);border-radius:10px;padding:6px 14px;transform:rotate(-14deg);letter-spacing:.1em;animation:stampIn2 .3s cubic-bezier(.2,1.6,.4,1) both;background:rgba(248,238,214,.88)}
@keyframes stampIn2{from{transform:rotate(8deg) scale(2.4);opacity:0}}
#cardsNav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:2px}
.navbtn{width:42px;height:42px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:var(--hard-sm);font-size:20px;font-weight:700;color:var(--teal-d);transition:transform .15s var(--bounce)}
.navbtn:active{transform:translate(2px,2px) scale(1.08,.9);box-shadow:none}
#cardsDots{display:flex;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper2);padding:0}
.dot.active{background:var(--coral)}
#cardsCount{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink2)}
#swipeHint{text-align:center;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.24em;color:var(--teal-d);margin-top:8px}
/* ultimate cards */
#ultCards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.ucard{flex:1 1 220px;max-width:270px;background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:var(--hard);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:center;transition:transform .18s var(--bounce)}
.ucard:hover{transform:translateY(-6px) rotate(-.8deg)}
.ucard .usym{font-family:var(--slab);font-size:52px;line-height:1;-webkit-text-stroke:2px var(--ink);text-shadow:3px 4px 0 rgba(36,29,21,.25)}
.ucard .ucat{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.26em;color:var(--ink2)}
.ucard .uname{font-family:var(--ui);font-weight:800;font-size:19px;color:var(--ink)}
.ucard .udesc{font-size:12.5px;font-weight:500;line-height:1.45;color:var(--ink2);flex:1}
.ucard .btn{font-size:12px;padding:10px}
.u0 .usym{color:var(--teal)}.u1 .usym{color:var(--magenta)}.u2 .usym{color:var(--mustard)}
/* pause / over stats */
.statrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--hard-sm);padding:10px 18px;min-width:96px;text-align:center}
.stat .sv{font-family:var(--slab);font-size:26px;color:var(--teal-d)}
.stat .sl{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.24em;color:var(--ink2)}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:0 1 auto;min-width:150px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grid2 .btn{font-size:12.5px;padding:11px}
#ovPeLine{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--magenta);background:var(--cream);border:2.5px dashed var(--magenta);border-radius:12px;display:inline-block;padding:7px 16px;margin-top:4px}
/* tree */
#treeHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
#treePeChip{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--night);color:var(--mustard);border:2.5px solid var(--ink);padding:8px 16px;border-radius:999px;box-shadow:var(--hard-sm)}
#treeRefund{font-size:11px;padding:9px 14px}
#treeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:8px 0 14px;width:100%}
.tcard{position:relative;background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:var(--hard);padding:0;display:flex;flex-direction:column;cursor:pointer;transition:transform .18s var(--bounce),box-shadow .18s var(--bounce);overflow:hidden;text-align:left;user-select:none}
.tcard:hover{transform:translateY(-5px) rotate(-.8deg);box-shadow:8px 11px 0 rgba(36,29,21,.32)}
.tcard:active{transform:translateY(-1px) scale(1.02,.97)}
.tcard .tband{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:3px solid var(--ink);color:var(--cream)}
.tcard .tband .tglyph{font-family:var(--slab);font-size:22px;line-height:1;flex:none;text-shadow:1.5px 1.5px 0 rgba(36,29,21,.45)}
.tcard .tband .tmeta{display:flex;flex-direction:column;gap:1px;min-width:0}
.tcard .tband .tname{font-family:var(--ui);font-weight:800;font-size:14px;letter-spacing:.03em;line-height:1.1;text-shadow:1px 1px 0 rgba(36,29,21,.4)}
.tcard .tband .tkick{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.18em;opacity:.9}
.tcard .tbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.tcard .tdesc{font-size:12.5px;font-weight:500;line-height:1.4;color:var(--ink2)}
.tcard .tfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tcard .tpips{display:flex;gap:4px}
.tcard .tpip{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--paper2)}
.tcard .tpip.on{background:var(--coral)}
.tcard .tcost{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--cream);background:var(--teal-d);border:2px solid var(--ink);padding:4px 10px;border-radius:999px;box-shadow:2px 2px 0 rgba(36,29,21,.25)}
.tcard.afford .tcost{background:var(--coral);animation:costPulse 1.3s ease-in-out infinite}
@keyframes costPulse{50%{background:var(--mustard);color:var(--ink)}}
.tcard.maxed .tcost{background:var(--ink);color:var(--cream)}
.tcard.maxed{opacity:.92}
.tcard.deny{animation:deny .3s}
@keyframes deny{25%{transform:translateX(-5px) rotate(-1deg)}75%{transform:translateX(5px) rotate(1deg)}}
.tcard.center .tband{background:linear-gradient(160deg,var(--teal),var(--teal-d))}
.tcard[data-id="dmg"] .tband{background:linear-gradient(160deg,var(--coral),var(--red))}
.tcard[data-id="rate"] .tband{background:linear-gradient(160deg,var(--mustard),var(--amber));color:var(--ink)}
.tcard[data-id="rate"] .tband .tname,.tcard[data-id="rate"] .tband .tglyph{text-shadow:none;color:var(--ink)}
.tcard[data-id="range"] .tband{background:linear-gradient(160deg,var(--sage),var(--sage-d))}
.tcard[data-id="pspd"] .tband{background:linear-gradient(160deg,#3c818c,var(--teal-d))}
.tcard[data-id="regen"] .tband{background:linear-gradient(160deg,#5e9068,#3d6a48)}
.tcard[data-id="crit"] .tband{background:linear-gradient(160deg,var(--magenta),#7e2f61)}
.tcard[data-id="harvest"] .tband{background:linear-gradient(160deg,var(--pink),var(--magenta))}
@media (max-width:520px){
  #treeGrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .tcard .tband .tname{font-size:13px}
}
/* settings */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 4px;border-bottom:2px dashed rgba(36,29,21,.25)}
.setrow:last-child{border-bottom:none}
.setrow .st{font-weight:700;font-size:14px;letter-spacing:.1em}
.setrow .ss{font-size:11.5px;font-weight:500;color:var(--ink2);letter-spacing:.02em}
.switch{position:relative;width:64px;height:32px;flex:none;border:3px solid var(--ink);border-radius:20px;background:var(--paper2);box-shadow:var(--hard-sm);transition:background .2s}
.switch .knob{position:absolute;top:2px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--cream);border:2.5px solid var(--ink);transition:left .2s var(--bounce)}
.switch.on{background:var(--teal)}
.switch.on .knob{left:33px;background:var(--mustard)}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:var(--hard-sm);flex:none}
.seg button{padding:7px 12px;font-weight:700;font-size:11px;letter-spacing:.12em;background:var(--cream);color:var(--ink2);border-right:2.5px solid var(--ink)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--coral);color:var(--cream)}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:12px;border:2.5px solid var(--ink);border-radius:8px;background:repeating-linear-gradient(-55deg,var(--paper2) 0 6px,var(--paper) 6px 12px);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--coral);border:3px solid var(--ink);box-shadow:2px 2px 0 rgba(36,29,21,.3);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--coral);border:3px solid var(--ink);cursor:pointer}
#volVal{font-family:var(--mono);font-weight:600;font-size:12px;min-width:42px;text-align:right;color:var(--teal-d)}
.volwrap{display:flex;align-items:center;gap:10px}
/* guide */
.gsec{display:flex;gap:14px;padding:12px 2px;border-bottom:2px dashed rgba(36,29,21,.22);align-items:flex-start}
.gsec:last-of-type{border-bottom:none}
.gglyph{flex:none;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--cream);box-shadow:var(--hard-sm);text-shadow:1px 1px 0 var(--ink)}
.gsec p{font-size:13.5px;font-weight:500;line-height:1.55}
.gsec b{color:var(--teal-d)}
@media (min-width:920px){
  #cardsTrack{overflow:visible;justify-content:center;scroll-snap-type:none}
  #cardsNav,#swipeHint{display:none}
}
@media (max-width:700px){
  .card{flex:0 0 min(78vw,270px)}
  #hud{gap:6px;padding:8px 8px}
  #hudLeft{gap:6px;max-width:calc(100% - 84px)}
  #hudChips{gap:4px}
  .chip{font-size:10.5px;padding:4px 9px}
  .chip .lab{font-size:10px}
  #hpChip{width:100%;min-width:200px;max-width:250px;padding:7px 10px 8px}
  #hpBar{max-width:96px;height:9px}
  .hudbtn{width:36px;height:36px;border-radius:10px;font-size:15px}
  #bossBarWrap{top:112px}
  #ultBtn{width:72px;height:72px;bottom:12px}
  #ultGlyph{font-size:26px}
  #runHint{bottom:98px;font-size:9px}
  #weaponDock{bottom:14px;right:8px;grid-template-columns:repeat(3,33px);gap:5px}
  .wdock{width:33px;height:33px;border-radius:10px}
  .wdock svg{width:17px;height:17px}
  .panel{padding:16px 14px}
  .grid2{grid-template-columns:1fr}
  #toasts{top:20%;width:min(320px,92vw)}
  .btn{font-size:13.5px}
  .btn-big{font-size:16px}
}
@media (max-width:480px){
  .setrow{flex-wrap:wrap}
  .setrow .seg,.setrow .volwrap{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
</style>

<body>
<div id="app">
  <!-- ================= MENU ================= -->
  <section id="menuScreen" class="screen">
